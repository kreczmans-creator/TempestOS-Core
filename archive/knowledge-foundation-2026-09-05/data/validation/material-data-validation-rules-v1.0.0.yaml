- rule_id: VAL-001
  name: property_unit_dimension
  severity: error
  description: Every numeric property observation must carry a canonical compatible
    unit.
- rule_id: VAL-002
  name: condition_required_for_strength
  severity: error
  description: Strength, hardness, fatigue and fracture observations require applicable
    condition context or an explicit generic-screening designation.
- rule_id: VAL-003
  name: temperature_required
  severity: error
  description: Temperature-sensitive observations should carry reference/test temperature
    where materially relevant.
- rule_id: VAL-004
  name: source_required_for_verified_data
  severity: error
  description: Promotion beyond candidate_reference requires concrete source/provenance.
- rule_id: VAL-005
  name: no_implicit_equivalence
  severity: error
  description: Designation similarity never automatically implies standards or certification
    equivalence.
- rule_id: VAL-006
  name: conflict_preservation
  severity: error
  description: Conflicting source observations remain distinct until an explicit engineering
    selection decision is recorded.
- rule_id: VAL-007
  name: polymer_condition_context
  severity: warning
  description: Capture grade, reinforcement, moisture, temperature, strain rate and
    orientation where relevant.
- rule_id: VAL-008
  name: metal_product_form
  severity: warning
  description: Capture product form and thickness/section where the governing standard
    makes properties size-dependent.
