rules:
- Preserve material condition and product form in every comparison.
- Do not use qualitative corrosion language as an environment-specific allowable.
- For high-temperature service distinguish oxidation resistance, creep and short-term
  strength.
- Availability and cost are qualitative procurement context, not quotations.
- Every numerical property retains source provenance.
