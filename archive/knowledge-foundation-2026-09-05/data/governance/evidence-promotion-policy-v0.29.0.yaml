promotion_rules:
- Retain exact condition and test context for literature values.
- Keep AM, wrought, forged, cast and powder routes separate unless equivalence is
  demonstrated.
- Never store fatigue strength without stress ratio or an explicit unavailable marker.
- Never store fracture toughness without temperature, orientation/product form and
  test method where available.
- Never substitute Charpy impact energy for fracture toughness.
- Typical supplier values remain screening/reference values unless independently verified.
