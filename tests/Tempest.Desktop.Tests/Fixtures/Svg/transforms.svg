<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150">
  <g transform="translate(20,20)">
    <rect width="40" height="30" fill="#1c2d97"/>
    <g transform="scale(0.5)">
      <circle cx="140" cy="30" r="30" fill="#40a2ce"/>
    </g>
  </g>
  <rect x="100" y="20" width="40" height="30" fill="#6c29d9" transform="rotate(30 120 35)"/>
  <rect x="150" y="20" width="40" height="30" fill="#c0392b" transform="skewX(-20)"/>
  <g transform="matrix(1 0 0 1 10 80)">
    <g transform="rotate(-10)">
      <polygon points="0,40 40,40 20,0" fill="#000000"/>
    </g>
  </g>
  <g transform="translate(80 80) scale(2 1)">
    <rect width="20" height="40" fill="#e4e7ee" stroke="#000" stroke-width="1"/>
  </g>
  <rect x="140" y="80" width="40" height="40" fill="#40a2ce" transform="translate(10,0) rotate(45 160 100)"/>
</svg>
