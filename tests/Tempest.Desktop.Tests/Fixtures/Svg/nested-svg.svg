<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <rect width="100" height="100" fill="#ffffff"/>
  <!-- A nested svg with its own viewBox: the navy square fills its 50 by 50 viewport; the red square beside it lies outside and is clipped. -->
  <svg x="10" y="10" width="50" height="50" viewBox="0 0 10 10">
    <rect width="10" height="10" fill="#1c2d97"/>
    <rect x="10" width="10" height="10" fill="#c0392b"/>
  </svg>
</svg>
