<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="150">
  <defs>
    <rect id="bar" width="40" height="20" fill="#1c2d97"/>
    <circle id="dot" r="10" fill="#c0392b"/>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2d97"/>
      <stop offset="1" stop-color="#40a2ce"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#6c29d9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <use href="#bar" x="10" y="10"/>
  <use xlink:href="#bar" x="60" y="10"/>
  <use href="#dot" x="130" y="20"/>
  <use href="#dot" x="160" y="20" fill="#000000"/>
  <rect x="10" y="50" width="80" height="40" fill="url(#fade)"/>
  <rect x="100" y="50" width="80" height="40" fill="url(#vertical)"/>
  <circle cx="60" cy="120" r="25" fill="url(#glow)"/>
  <rect x="100" y="100" width="80" height="40" fill="url(#missing)" stroke="#000" stroke-width="2"/>
</svg>
