<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <rect width="100" height="100" fill="#ffffff"/>
  <!-- The same 10 by 10 viewBox (navy square, red square to its right) fitted three ways into a 90 by 30 viewport. -->
  <svg x="0" y="0" width="90" height="30" viewBox="0 0 10 10" preserveAspectRatio="none">
    <rect width="10" height="10" fill="#1c2d97"/>
    <rect x="10" width="10" height="10" fill="#c0392b"/>
  </svg>
  <svg x="0" y="35" width="90" height="30" viewBox="0 0 10 10" preserveAspectRatio="xMinYMin meet">
    <rect width="10" height="10" fill="#1c2d97"/>
    <rect x="10" width="10" height="10" fill="#c0392b"/>
  </svg>
  <svg x="0" y="70" width="90" height="30" viewBox="0 0 10 10" preserveAspectRatio="xMidYMid slice">
    <rect width="10" height="10" fill="#1c2d97"/>
    <rect x="10" width="10" height="10" fill="#c0392b"/>
  </svg>
</svg>
