<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px}.g{display:flex;gap:10px}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}.nm{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}</style></head><body><div class="g">
<div class="sw" style="background:#12b981;color:#070915"><span class="nm" style="color:inherit">Success</span><span class="mono" style="color:inherit;opacity:.7">#12b981</span></div><div class="sw" style="background:#f5a524;color:#070915"><span class="nm" style="color:inherit">Warning</span><span class="mono" style="color:inherit;opacity:.7">#f5a524</span></div><div class="sw" style="background:#e5484d;color:#f5f6fa"><span class="nm" style="color:inherit">Danger</span><span class="mono" style="color:inherit;opacity:.7">#e5484d</span></div><div class="sw" style="background:#00aeef;color:#070915"><span class="nm" style="color:inherit">Info</span><span class="mono" style="color:inherit;opacity:.7">#00aeef</span></div>
</div></body></html>
