<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px}.g{display:flex;gap:10px}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}.nm{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}</style></head><body>
<div style="display:flex;gap:14px;align-items:flex-end">

<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:74px;height:56px;background:var(--navy-700);border:1px solid var(--border-default);clip-path:var(--notch-clip-tr)"></div><span class="mono">notch 10px</span></div>
