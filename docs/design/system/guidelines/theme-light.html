<!-- @dsCard group="Colors" viewport="700x170" name="Paper theme" subtitle=".t-light flips surfaces to paper and the accent to indigo" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px}.g{display:flex;gap:10px}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}.nm{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}</style></head><body style="padding:0">
<div class="t-light" style="height:170px;background:var(--bg-page);padding:20px;display:flex;gap:16px;align-items:center">
<div style="background:var(--surface-card);border:1px solid var(--surface-card-border);border-radius:5px;box-shadow:var(--shadow-md);padding:16px 18px;flex:1">
<div style="font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-accent)">Array 04</div>
<div style="font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--text-heading);margin-top:6px">12.4 MW</div>
<div style="font-size:13px;color:var(--text-body);margin-top:4px">Paper theme is for documents, decks and print.</div>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="height:36px;padding:0 16px;display:flex;align-items:center;background:var(--accent-primary);color:var(--on-accent);border-radius:3px;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase">Primary</div>
<div style="height:36px;padding:0 16px;display:flex;align-items:center;border:1px solid var(--border-default);color:var(--text-heading);border-radius:3px;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase">Secondary</div>
</div></div></body></html>
