<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="80–320ms, cubic-bezier(.2,0,.2,1). No bounce, no overshoot." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px}.g{display:flex;gap:10px}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}.nm{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.tr{width:16px;height:16px;background:var(--cyan-500);animation:sl 2.4s var(--ease-standard) infinite alternate}@keyframes sl{to{transform:translateX(300px)}}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:14px;align-items:baseline"><span class="mono" style="width:110px">instant 80ms</span><span style="font-size:12px;color:var(--text-muted)">pressed states</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="mono" style="width:110px">fast 120ms</span><span style="font-size:12px;color:var(--text-muted)">hover, focus, toggles</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="mono" style="width:110px">med 200ms</span><span style="font-size:12px;color:var(--text-muted)">panels, tabs, dialogs</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="mono" style="width:110px">slow 320ms</span><span style="font-size:12px;color:var(--text-muted)">page and route change</span></div>
<div style="margin-top:6px;border-top:1px solid var(--border-subtle);padding-top:12px"><div class="tr"></div></div>
</div></body></html>
