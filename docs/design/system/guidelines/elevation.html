<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body);padding:18px 20px}.g{display:flex;gap:10px}.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}.nm{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-heading)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:78px;padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}</style></head><body>
<div style="display:flex;gap:16px;align-items:center">
<div style="width:150px;height:76px;background:var(--navy-700);border:var(--hairline-dark);border-radius:5px;display:flex;align-items:flex-end;padding:8px"><span class="mono">hairline a08</span></div>
<div style="width:150px;height:76px;background:var(--navy-600);border:var(--hairline-dark-strong);border-radius:5px;display:flex;align-items:flex-end;padding:8px"><span class="mono">a14 + raised</span></div>
<div style="width:150px;height:76px;background:var(--navy-700);border:1px solid transparent;box-shadow:var(--glow-cyan);border-radius:5px;display:flex;align-items:flex-end;padding:8px"><span class="mono">glow-cyan</span></div>
<div class="t-light" style="width:150px;height:76px;background:#fff;box-shadow:var(--shadow-lg);border-radius:5px;display:flex;align-items:flex-end;padding:8px"><span class="mono" style="color:var(--slate-600)">shadow-lg (light)</span></div>
</div></body></html>
