# WP 14.2A (ADR-0116): builds the Companion's mobile platform heads,
# which deliberately live OUTSIDE src/TempestOS.slnx - they need the .NET
# mobile workloads (plus the Android SDK / a macOS toolchain) that the
# gating CI environment does not install. Non-gating by design: manual
# dispatch only, no branch-protection role; the CI Gate is untouched.
#
# The authoring environment for WP 14.2A could not run these jobs (no
# Android SDK obtainable; iOS workload does not exist on Linux) - the
# Android head was validated there by restore plus a Roslyn compile
# against the workload's reference assemblies; this workflow's first
# dispatch is the heads' first full-toolchain build (TD-57).
name: Mobile Heads

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-heads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Head (Release)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the Android workload
        run: |
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Release, net10.0-android)
        # The windows-2022 runner image ships an Android SDK and JDK.
        run: |
          dotnet build src/Tempest.Companion.Android/Tempest.Companion.Android.csproj -c Release -f net10.0-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # WP 14.2.1 hardening (never executed at authoring time, so every
      # assumption in it was a liability): the artefact is EVIDENCE of a
      # green build, not the build itself, so it must not be able to fail
      # the job - neither by artifact-storage exhaustion (the fault that
      # reddened the whole repository's CI, ADR-0117) nor by a packaging
      # path this environment could never verify. `*Signed.apk` was a
      # guess about .NET Android's own output naming; the glob is widened
      # to any .apk/.aab and demoted to `warn`, so a naming difference
      # shows up as a missing artefact against a passing build instead of
      # a red job that says nothing about whether the head compiles.
      - name: Upload package
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tempest-companion-android
          path: |
            src/Tempest.Companion.Android/bin/Release/net10.0-android/*.apk
            src/Tempest.Companion.Android/bin/Release/net10.0-android/*.aab
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS Head (Release, simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the iOS workload
        run: dotnet workload install ios

      - name: Build (Release, net10.0-ios, simulator - no signing required)
        run: dotnet build src/Tempest.Companion.iOS/Tempest.Companion.iOS.csproj -c Release -f net10.0-ios -r iossimulator-arm64

      # Same reasoning as the Android upload above.
      - name: Upload app bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tempest-companion-ios-simulator
          path: src/Tempest.Companion.iOS/bin/Release/net10.0-ios/**/*.app
          if-no-files-found: warn
          retention-days: 7
