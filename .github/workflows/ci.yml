name: CI

# WP 11.1A — Continuous Integration & Build Verification.
#
# This is TempestOS's first CI pipeline and the authoritative engineering
# gate for every future change: it builds Debug and Release, runs the
# complete automated test suite against both (against Release only on a
# pull request - ADR-0160, below), and fails immediately on any build
# error or test failure. Before this pipeline existed, every
# "0 Warnings/0 Errors, N/N tests passing" claim in this project's own
# Work Package retrospectives was a manually-run, self-reported
# assertion — see docs/releases/v0.11.0/WP11.0A Platform Architecture
# Review.md, finding R-1. This workflow closes that gap: the claim is now
# machine-verified on every pull request, on pushes to main and
# release/** (not on version tags, ADR-0164), and on demand (see `on:` below for why other pushes
# are not built).
#
# See docs/academy/06 Engineering Standards/04-continuous-integration.md
# for the philosophy this workflow implements, and
# docs/releases/v0.11.0/WP11.1A Implementation Report.md for the design
# rationale behind every decision below.
#
# WP 11.2A adds a third, independent job — governance-health-check — a
# separate validation stage that runs after build-and-test completes,
# auditing governance-document consistency rather than code. WP 17.0B
# ("Governance reset") archived the register suite this job used to
# cross-check and reduced it to five checks against what remains:
# the ADR Register against docs/adr/ (by file and by count), VERSION
# against its planned release folder, every *tagged* release folder
# having a Release Notes file, and a new check that a PR's Markdown
# lines added never exceed its code lines added (CONTRIBUTING.md's PR
# budget). See scripts/governance-healthcheck.ps1's own header for the
# current check list, and docs/releases/v0.11.0/WP11.2A Governance
# Health-Check Tool.md for why this job exists in the first place.
#
# `WP 20.3D` splits build-and-test's own matrix again, this time by test
# group rather than configuration alone: growth in the Desktop suite's own
# size kept forcing this job's whole-leg `timeout-minutes` up (30 to 45 at
# v0.17.0, 45 to 90 at `WP 19.9.1`), which was addressing a symptom, not
# the cause — one `dotnet test` invocation running the whole solution's
# tests in series. A new `matrix.shard` dimension (`core`,
# `desktop-1`/`2`/`3`) now runs Core once, unsharded, and the Desktop
# assembly as three roughly-equal, independent, parallel legs per
# configuration, each with its own Build/Test/summary/artefact steps — see
# that matrix's own remark for the split itself, and build-and-test's
# `timeout-minutes` remark for why 90 could come back down to 45 rather
# than needing raising a third time.
#
# `WP 21.5E` adds a fourth required job, dependency-scan — `dotnet list
# package --vulnerable --include-transitive` over the whole solution,
# parsed by scripts/check-vulnerable-packages.ps1 (which fails the step on
# any finding, or on a scan it cannot parse at all) — bringing forward the
# programme's own `WP RC.0C` ("Dependency vulnerability scan is a required
# CI check"). See that job's own remark, and docs/security/Security
# Posture.md.
#
# ADR-0160 (PO decision 2026-10-01, v0.23.0 CI board G-20): a pull
# request runs the Release test legs only. Its Debug legs still restore and
# build with TreatWarningsAsErrors (a Debug-only compile break is still
# caught), but every Debug test step is skipped on `pull_request`. A push
# to main or release/**, a manual run and the schedule keep the full
# Debug + Release test matrix, so every commit that lands is still tested
# in both configurations. The skip is per step, not per job: all eight
# matrix legs exist on every event, so job names stay stable and CI Gate's
# strict `success` check below needs no special case (see its remark).

on:
  # Push runs only main and release branches; every other branch is
  # gated by its pull request. With both triggers unfiltered, one push to a
  # branch with an open PR started two complete runs (the push run under
  # refs/heads/<branch> and the PR run under refs/pull/<n>/merge, separate
  # concurrency groups, so neither cancelled the other) - PO, 2026-10-01.
  # A branch without a PR can still be run by hand (workflow_dispatch).
  #
  # One known double run remains, deliberately: a push to a release/**
  # branch that has an open PR (release -> main) starts both a push run and
  # a PR run, in different concurrency groups. It is not filtered out with
  # `branches-ignore: [release/**]` under pull_request because that filter
  # matches the PR's *base* branch, not its head: it would stop CI on every
  # PR *into* a release branch (the normal way work reaches one) and would
  # not touch the release -> main PR at all. The push run gates the branch
  # head, the PR run gates the merge result; for release branches both are
  # wanted (v0.23.0 CI board G-08).
  push:
    branches:
      - main
      - "release/**"
    # No `tags:` (ADR-0164): a release tag points at a commit CI has
    # already run on, and release.yml's ci-gate accepts that run. Running
    # the whole matrix again on the tag push re-proved the same SHA.
  pull_request:
  workflow_dispatch: {}
  # WP 17.0C: the mutation job below (Stryker.NET) is deliberately scoped
  # to this schedule and to workflow_dispatch only, not to push/pull_request
  # - a mutation-testing run over even the narrow
  # src/Tempest.Core/Calculations + UnitsAndQuantities scope takes
  # substantially longer than the rest of this pipeline and is diagnostic,
  # not a merge gate. Monday 06:00 UTC — ahead of the working week, clear
  # of any push traffic.
  schedule:
    - cron: "0 6 * * 1"

# cancel-in-progress applies to pull request runs only. A pushed ref
# (main, release/**) is a commit that has landed, and each one is
# gated in its own right: with cancellation on for release branches, runs
# #420 to #427 on release/v0.21.0 (2026-09-15) were each cancelled by the
# next push, so seven consecutive heads - three of them carrying the fix
# for the previous head's red run - were never gated at all, and main's
# runs #478 and #479 were cancelled the same way (v0.23.0 CI board G-22).
# A pull request's intermediate heads are not release candidates, so a
# superseded PR run is still cancelled and the runner minutes go to the
# head that will be merged.
#
# The group is per commit for every event but a pull request. With one
# group per ref and cancellation off, GitHub still keeps only one pending
# run per group: a third push while a run was in progress cancelled the
# second push's queued run, so that head was never gated after all. A
# group per SHA queues nothing; a pull request keeps one group per ref so
# its superseded run is cancelled as above.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  SOLUTION_PATH: src/TempestOS.slnx
  # WP 17.0A: every render deadline in Tempest.Desktop.Tests is scaled by
  # this factor (DesktopTestHelpers.Deadline). A fixed ten-second deadline
  # passed on a quiet runner and failed on a loaded workstation.
  TEMPEST_TEST_TIMEOUT_FACTOR: "3"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.configuration }} / ${{ matrix.shard }})
    # Pinned to a specific runner image, not the floating "windows-latest"
    # alias — this project pins every other version it depends on exactly
    # (global.json's SDK version, every PackageReference in every
    # .csproj); an unannounced runner-image upgrade silently changing CI
    # behaviour would be the identical class of risk. Bump deliberately,
    # not automatically.
    runs-on: windows-2022
    # 45, not 90 (`WP 20.3D`, restoring the pre-`WP 19.9.1` ceiling): the
    # 90-minute ceiling existed only because one `dotnet test` invocation
    # ran the whole solution's tests — Core and all ~600 Desktop tests —
    # in a single leg, which measured 43 minutes for Debug on a hosted
    # runner at 594 Desktop tests (`WP 19.9.1`, run 34882951343) and kept
    # growing with the suite. `matrix.shard` below now splits that one
    # invocation into four independent, parallel legs per configuration —
    # `core` (the whole Core.Tests project, unsharded, fast) and three
    # roughly-equal Desktop shards (`desktop-1`/`2`/`3`, about 220 tests each,
    # see the Test Desktop shard steps' own remarks for the split) — so no
    # single leg should approach even half of the old combined figure.
    # Measured on a hosted runner, run 36901461548 (v0.23.0, green in about
    # 15 min end to end): the Release test steps took about 10 min (core),
    # 11 (desktop-1), 8 (desktop-2) and 6 (desktop-3). Earlier v0.23.0 runs
    # overran 45 when every test host began seeding 276 reference records
    # at synchronous=FULL, an fsync per commit; the Desktop suite now runs
    # at NORMAL (ADR-0144, amended 2026-10-01, TestPersistenceDurability).
    # This is the whole-leg ceiling. Each test step also has its own
    # 25-minute `timeout-minutes`, so a broad slowdown fails that step
    # while the summary and artefact steps still have time to publish its
    # .trx, and the per-test backstop (`--blame-hang-timeout`) is unchanged.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        # Four independent test groups per configuration (`WP 20.3D`):
        # `core` runs the whole `Tempest.Core.Tests` project, unsharded —
        # it is the fast assembly (`WP 17.0A` measured roughly five
        # minutes) and gains nothing from splitting. `desktop-1`/`2`/`3`
        # each run one third of `Tempest.Desktop.Tests`, selected by a
        # `--filter` on the first letter of the class's own namespace
        # segment (its sub-folder name for a nested class — `Layout`,
        # `Dashboards`, `Evidence`, `Quotations` — or the class's own leaf
        # name otherwise): `desktop-1` is A-D, `desktop-2` is E-P,
        # `desktop-3` is Q-Z. Counts at v0.24.0 (test cases listed by
        # `dotnet test --list-tests`, theory rows included): 379 / 284 /
        # 431 of 1094 (v0.23.0: 361 / 284 / 300 of 945; v0.24.0's Xero
        # tests live under `Xero`, so they all landed in desktop-3) —
        # every future class this alphabet range can ever describe still
        # lands in exactly one shard with no filter list to maintain
        # (`CiShardCoverageTests` reads these filters and fails if a test
        # falls in none or two), at the cost of a split that tracks test
        # *count*, not time. Run 36901461548's Release test steps took
        # about 11 / 8 / 6 min for desktop-1/2/3, desktop-1's including
        # about 4 min of waits that could never succeed (fixed by v0.23.0
        # CI board G-01, so expect it to drop); each shard's summary now
        # lists its ten slowest tests, which is the data to rebalance on.
        # `desktop-2` (E-P) carries `Category=LayoutWalk` entirely
        # (`Layout.LayoutWalkTests`, `Layout.ShellCollapseLayoutWalkTests`
        # — both classes live under the `Layout` sub-namespace, so both
        # fall in the `L` letter regardless of their own leaf class name),
        # and its Release step publishes the walk's screenshots — see that
        # step's own remark. Rebalance by moving a boundary letter (not by
        # hand-listing classes) if a future suite addition skews one
        # shard heavily; each shard's own filter is spelled out in its
        # own step below, not centralised, so a moved boundary is a
        # two-step edit (this remark, the two affected filters).
        shard: [core, calc, desktop-1, desktop-2, desktop-3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the SDK version and rollForward policy directly from
      # global.json — the same single source of truth every local build
      # already uses (Directory.Build.props applies the identical
      # "one file, read once" convention to the platform's own Version).
      # A second, hand-typed SDK version here would be exactly the kind
      # of drift this pipeline exists to prevent.
      - name: Set up .NET SDK (from global.json)
        id: setup-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The SDK download fails now and then on the download CDN (HTTP
      # 409), which failed whole legs before a line of
      # this repository ran. One retry after a pause; a second failure
      # fails the job here.
      - name: Wait before retrying the .NET SDK download
        if: steps.setup-dotnet.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Set up .NET SDK (from global.json, retry)
        if: steps.setup-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # ADR-0160: every restore in this workflow is locked. Each project's
      # committed packages.lock.json pins every direct and transitive
      # package by version and content hash; --locked-mode fails the step
      # (NU1004) instead of resolving anything the lock does not name, so a
      # stale lock or a package that changed on the feed stops CI here.
      # Directory.Build.props also sets RestoreLockedMode when CI=true, so
      # the implicit restores of later steps are locked too. The locks
      # carry win-x64 and linux-x64 (Directory.Build.props explains why),
      # so the same lock restores on these Windows legs and on the Linux
      # smoke job. Regenerate with `dotnet restore src/TempestOS.slnx
      # --force-evaluate` after changing a PackageReference (CONTRIBUTING.md).
      - name: Restore (locked)
        run: dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      # TreatWarningsAsErrors is applied here, at the CI build step only —
      # Directory.Build.props itself is deliberately left unchanged
      # (it sets it false, so a local `dotnet build` still behaves exactly
      # as it always has). This is the mechanical enforcement of the "0
      # Warnings" bar this project has always claimed but never had a
      # machine verify: confirmed locally, before this workflow was
      # written, that the current tree builds clean under this flag in
      # both configurations, so this is closing a gap, not introducing a
      # new failure mode.
      - name: Build (${{ matrix.configuration }})
        shell: pwsh
        run: |
          $log = "build-${{ matrix.configuration }}.log"
          dotnet build "${{ env.SOLUTION_PATH }}" `
            --configuration ${{ matrix.configuration }} `
            --no-restore `
            -p:TreatWarningsAsErrors=true `
            2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed for configuration '${{ matrix.configuration }}' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      # `--blame-hang`/`--blame-hang-timeout` (`WP16.4A-R1`): without these,
      # a test that hangs — a gated seam that stops being reached, for
      # instance — has no backstop but the step's own 25-minute
      # `timeout-minutes`, which kills the whole step with no indication of
      # which test caused it. 5 minutes is well above any single test's
      # real run time (the slowest Desktop journeys take well under a few
      # minutes at TEMPEST_TEST_TIMEOUT_FACTOR 3; each shard's summary
      # lists its ten slowest) and well below the step timeout, so a
      # genuine hang is caught and named — with a hang dump collected and
      # uploaded with the test results — before the step itself is killed.
      # --collect:"XPlat Code Coverage" (WP 17.0C): coverlet.collector is
      # already referenced by both test projects: this only switches the
      # collector on. Writes one coverage.cobertura.xml per test project
      # under TestResults/<configuration>/<shard>/<guid>/ - read back,
      # purely diagnostically, by the summary step below. Release shards
      # only, since `WP 19.9.1` (2026-09-14): the instrumentation roughly
      # doubles the Desktop suite's time on a hosted runner, and one
      # coverage figure per shard is all the summary step ever reports on;
      # the summary step already states plainly when no coverage file
      # exists, so a Debug shard's summary says so rather than lying.
      # `WP 20.3D` sharding: each `matrix.shard` value gets its own
      # Release/Debug step pair, still spelled out literally rather than
      # parameterised over `matrix.shard`/`matrix.configuration` inside one
      # step — `WP 19.9.1` already hit pwsh mishandling a conditionally
      # splatted argument array (run 34895195651) trying exactly that
      # collapse for configuration alone; the same risk applies to a
      # conditional `--filter`/`--collect` combination, so every leg's
      # command is still written out in full rather than assembled.
      # ADR-0160 (G-20): every Debug test step below also carries
      # `github.event_name != 'pull_request'`, so a pull request's Debug
      # legs build and then skip their tests; any other event runs them.
      # A skipped step leaves the job `success`, which is what CI Gate reads.
      - name: Test Core (Release)
        if: matrix.configuration == 'Release' && matrix.shard == 'core'
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet test tests/Tempest.Core.Tests `
            --configuration Release `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Release/core" `
            --collect:"XPlat Code Coverage" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Core tests failed for configuration 'Release' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      # `v0.26.0` (ADR-0165): the Tempest.Calc test assemblies run as their
      # own shard, in series, the same shape as Core's leg. Every project
      # runs even when an earlier one fails, and the step fails at the end
      # naming each failed project: it used to stop at the first, so from
      # run 652 a red Library run hid whether Calculators, FluidPower and
      # Import passed at all.
      - name: Test Calc (Release)
        if: matrix.configuration == 'Release' && matrix.shard == 'calc'
        timeout-minutes: 25
        shell: pwsh
        run: |
          $failed = @()
          foreach ($project in @("tests/Tempest.Calc.Tests.Engine", "tests/Tempest.Calc.Tests.Sheets", "tests/Tempest.Calc.Tests.Library", "tests/Tempest.Calc.Tests.Calculators", "tests/Tempest.Calc.Tests.FluidPower", "tests/Tempest.Calc.Tests.Import")) {
            if (-not (Test-Path $project)) { continue }
            dotnet test $project `
              --configuration Release `
              --no-build `
              --logger trx `
              --logger "console;verbosity=normal" `
              --results-directory "TestResults/Release/calc" `
              --collect:"XPlat Code Coverage" `
              --blame-hang `
              --blame-hang-timeout 5m
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Calc tests failed in '$project' for configuration 'Release' (exit code $LASTEXITCODE)."
              $failed += $project
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "One or more Calc tests failed for configuration 'Release' in: $($failed -join ', ')."
            exit 1
          }

      # Addendum C, C-4: the verification dashboard shows an embedded snapshot of the Track P reports, the known-defects document, the KAT and
      # chain results and the worked examples (and of the script that reads them). The stale-snapshot tests above fail on a stale one; this
      # step says the same from the script's own side, and runs the script's own tests (its two readers of the known-defects document).
      # It runs whatever the tests above did (it reads files, not the build).
      - name: Check the verification snapshot is current (Release)
        if: ${{ !cancelled() && matrix.configuration == 'Release' && matrix.shard == 'calc' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $python = (Get-Command python3 -ErrorAction SilentlyContinue) ?? (Get-Command python)
          & $python.Source scripts/generate-verification-snapshot.py --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The verification snapshot is stale: run python3 scripts/generate-verification-snapshot.py and commit the result (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }
          & $python.Source -m unittest discover -s tests/scripts
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The snapshot script's tests failed (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      - name: Test Calc (Debug)
        if: matrix.configuration == 'Debug' && matrix.shard == 'calc' && github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: pwsh
        run: |
          $failed = @()
          foreach ($project in @("tests/Tempest.Calc.Tests.Engine", "tests/Tempest.Calc.Tests.Sheets", "tests/Tempest.Calc.Tests.Library", "tests/Tempest.Calc.Tests.Calculators", "tests/Tempest.Calc.Tests.FluidPower", "tests/Tempest.Calc.Tests.Import")) {
            if (-not (Test-Path $project)) { continue }
            dotnet test $project `
              --configuration Debug `
              --no-build `
              --logger trx `
              --logger "console;verbosity=normal" `
              --results-directory "TestResults/Debug/calc" `
              --blame-hang `
              --blame-hang-timeout 5m
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Calc tests failed in '$project' for configuration 'Debug' (exit code $LASTEXITCODE)."
              $failed += $project
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "One or more Calc tests failed for configuration 'Debug' in: $($failed -join ', ')."
            exit 1
          }

      - name: Test Core (Debug)
        if: matrix.configuration == 'Debug' && matrix.shard == 'core' && github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet test tests/Tempest.Core.Tests `
            --configuration Debug `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Debug/core" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Core tests failed for configuration 'Debug' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      # Desktop shard 1 (A-D): 379 of 1094 Desktop test cases at v0.24.0 —
      # see the matrix's own `shard` remark above for the split's full
      # rationale and each boundary letter.
      - name: Test Desktop shard 1 (A-D) (Release)
        if: matrix.configuration == 'Release' && matrix.shard == 'desktop-1'
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet test tests/Tempest.Desktop.Tests `
            --configuration Release `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Release/desktop-1" `
            --collect:"XPlat Code Coverage" `
            --filter "FullyQualifiedName~Tempest.Desktop.Tests.A|FullyQualifiedName~Tempest.Desktop.Tests.B|FullyQualifiedName~Tempest.Desktop.Tests.C|FullyQualifiedName~Tempest.Desktop.Tests.D" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Desktop tests failed for shard desktop-1 (A-D), configuration 'Release' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      - name: Test Desktop shard 1 (A-D) (Debug)
        if: matrix.configuration == 'Debug' && matrix.shard == 'desktop-1' && github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet test tests/Tempest.Desktop.Tests `
            --configuration Debug `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Debug/desktop-1" `
            --filter "FullyQualifiedName~Tempest.Desktop.Tests.A|FullyQualifiedName~Tempest.Desktop.Tests.B|FullyQualifiedName~Tempest.Desktop.Tests.C|FullyQualifiedName~Tempest.Desktop.Tests.D" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Desktop tests failed for shard desktop-1 (A-D), configuration 'Debug' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      # Desktop shard 2 (E-P): 284 of 1094 Desktop test cases at
      # v0.24.0, including
      # every `Category=LayoutWalk` test (`Layout.LayoutWalkTests`,
      # `Layout.ShellCollapseLayoutWalkTests` — both under the `Layout`
      # sub-namespace, so both fall in the `L` letter).
      #
      # `WP 19.3A` — the layout verification walk (`TD-83`, the `WP 17.0A`
      # overlap class) is part of this shard: it launches the real, built
      # Desktop in-process (Avalonia.Headless with real Skia rendering) and
      # walks every rail entry and every project tab at two window sizes,
      # screenshotting each and failing on any intersecting sibling
      # `Bounds` or any control outside its parent. The Release step sets
      # `TEMPEST_LAYOUT_OUTPUT` so those screenshots land where the upload
      # step below reads them. Until v0.23.0 a separate Release-only step
      # re-ran `Category=LayoutWalk` just to set that variable, so the walk
      # ran twice in this leg (v0.23.0 CI board G-31); the same tests, the
      # same build and the same variable now produce the same screenshots
      # in one pass. The Debug step leaves it unset (screenshots stay under
      # the test output folder and are not uploaded).
      - name: Test Desktop shard 2 (E-P) (Release)
        if: matrix.configuration == 'Release' && matrix.shard == 'desktop-2'
        timeout-minutes: 25
        shell: pwsh
        env:
          # Absolute: the test host's working directory is the test project's
          # own output folder, so a relative path landed the PNGs under bin/
          # and the first run's upload found nothing (a warning, not a failure).
          TEMPEST_LAYOUT_OUTPUT: ${{ github.workspace }}/TestResults/layout
        run: |
          dotnet test tests/Tempest.Desktop.Tests `
            --configuration Release `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Release/desktop-2" `
            --collect:"XPlat Code Coverage" `
            --filter "FullyQualifiedName~Tempest.Desktop.Tests.E|FullyQualifiedName~Tempest.Desktop.Tests.F|FullyQualifiedName~Tempest.Desktop.Tests.G|FullyQualifiedName~Tempest.Desktop.Tests.H|FullyQualifiedName~Tempest.Desktop.Tests.I|FullyQualifiedName~Tempest.Desktop.Tests.J|FullyQualifiedName~Tempest.Desktop.Tests.K|FullyQualifiedName~Tempest.Desktop.Tests.L|FullyQualifiedName~Tempest.Desktop.Tests.M|FullyQualifiedName~Tempest.Desktop.Tests.N|FullyQualifiedName~Tempest.Desktop.Tests.O|FullyQualifiedName~Tempest.Desktop.Tests.P" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Desktop tests failed for shard desktop-2 (E-P), configuration 'Release' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      - name: Test Desktop shard 2 (E-P) (Debug)
        if: matrix.configuration == 'Debug' && matrix.shard == 'desktop-2' && github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet test tests/Tempest.Desktop.Tests `
            --configuration Debug `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Debug/desktop-2" `
            --filter "FullyQualifiedName~Tempest.Desktop.Tests.E|FullyQualifiedName~Tempest.Desktop.Tests.F|FullyQualifiedName~Tempest.Desktop.Tests.G|FullyQualifiedName~Tempest.Desktop.Tests.H|FullyQualifiedName~Tempest.Desktop.Tests.I|FullyQualifiedName~Tempest.Desktop.Tests.J|FullyQualifiedName~Tempest.Desktop.Tests.K|FullyQualifiedName~Tempest.Desktop.Tests.L|FullyQualifiedName~Tempest.Desktop.Tests.M|FullyQualifiedName~Tempest.Desktop.Tests.N|FullyQualifiedName~Tempest.Desktop.Tests.O|FullyQualifiedName~Tempest.Desktop.Tests.P" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Desktop tests failed for shard desktop-2 (E-P), configuration 'Debug' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      # Desktop shard 3 (Q-Z): 431 of 1094 Desktop test cases at v0.24.0.
      - name: Test Desktop shard 3 (Q-Z) (Release)
        if: matrix.configuration == 'Release' && matrix.shard == 'desktop-3'
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet test tests/Tempest.Desktop.Tests `
            --configuration Release `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Release/desktop-3" `
            --collect:"XPlat Code Coverage" `
            --filter "FullyQualifiedName~Tempest.Desktop.Tests.Q|FullyQualifiedName~Tempest.Desktop.Tests.R|FullyQualifiedName~Tempest.Desktop.Tests.S|FullyQualifiedName~Tempest.Desktop.Tests.T|FullyQualifiedName~Tempest.Desktop.Tests.U|FullyQualifiedName~Tempest.Desktop.Tests.V|FullyQualifiedName~Tempest.Desktop.Tests.W|FullyQualifiedName~Tempest.Desktop.Tests.X|FullyQualifiedName~Tempest.Desktop.Tests.Y|FullyQualifiedName~Tempest.Desktop.Tests.Z" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Desktop tests failed for shard desktop-3 (Q-Z), configuration 'Release' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      - name: Test Desktop shard 3 (Q-Z) (Debug)
        if: matrix.configuration == 'Debug' && matrix.shard == 'desktop-3' && github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: pwsh
        run: |
          dotnet test tests/Tempest.Desktop.Tests `
            --configuration Debug `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Debug/desktop-3" `
            --filter "FullyQualifiedName~Tempest.Desktop.Tests.Q|FullyQualifiedName~Tempest.Desktop.Tests.R|FullyQualifiedName~Tempest.Desktop.Tests.S|FullyQualifiedName~Tempest.Desktop.Tests.T|FullyQualifiedName~Tempest.Desktop.Tests.U|FullyQualifiedName~Tempest.Desktop.Tests.V|FullyQualifiedName~Tempest.Desktop.Tests.W|FullyQualifiedName~Tempest.Desktop.Tests.X|FullyQualifiedName~Tempest.Desktop.Tests.Y|FullyQualifiedName~Tempest.Desktop.Tests.Z" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more Desktop tests failed for shard desktop-3 (Q-Z), configuration 'Debug' (exit code $LASTEXITCODE)."
            exit $LASTEXITCODE
          }

      # Diagnostic-shaped like every other artefact upload in this
      # workflow (`if: always()`, `continue-on-error: true`,
      # `if-no-files-found: warn`) — publishing the screenshots is never
      # itself the gate; the Test step above already is. Pinned to the
      # `desktop-2` shard as well as Release, matching the step that
      # produces them (the shard 2 Release test step, which sets
      # `TEMPEST_LAYOUT_OUTPUT`): no other shard, and no Debug leg, ever
      # writes to `TestResults/layout`, so uploading there on any of them
      # would trip `if-no-files-found: error` below for a path that job
      # was never meant to populate. One artefact, not one per shard — a
      # single producer, so the name carries no shard suffix.
      - name: Upload layout verification screenshots (Release)
        if: always() && matrix.configuration == 'Release' && matrix.shard == 'desktop-2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Not advisory: a walk that wrote no screenshots is a broken walk.
        with:
          name: layout-screenshots
          path: TestResults/layout/**
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      # Runs even if Build or Test failed above (if: always()), so a
      # failing run still publishes exactly what it got through — the
      # same "disclose what actually happened" instinct this project
      # applies everywhere else, applied to its own CI output.
      # This summary is diagnostic output, never a verification gate — the
      # same reasoning the artefact uploads below carry, and the same
      # `continue-on-error`. Added against direct evidence: in run
      # 33659184434 `Test (Debug)` passed and this step then failed the job
      # on a .trx path it could not parse, so a green test run reported red.
      # Build, Test, the Governance Health Check and CI Gate are deliberately
      # untouched and remain hard gates. `WP 20.3D`: this step already runs
      # once per matrix job, so sharding needs no new aggregation logic —
      # each shard's own job produces its own step summary, scoped below to
      # that shard's own `TestResults/$config/$shard` directory (each
      # shard step writes exactly one .trx there, though the loop
      # below still tolerates more than one, same as it always did), and
      # GitHub renders every job's summary as its own section under the one
      # workflow run — so the run's overall summary page already reads as
      # "per shard", one table per group, with no separate rollup job
      # needed.
      - name: Publish build & test summary
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $config = "${{ matrix.configuration }}"
          $shard = "${{ matrix.shard }}"
          $resultsDir = "TestResults/$config/$shard"
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("### Build & Test — $config ($shard)")
          $lines.Add("")

          $buildLog = "build-$config.log"
          if (Test-Path $buildLog) {
            $errorCount   = (Select-String -Path $buildLog -Pattern ': error '   | Measure-Object).Count
            $warningCount = (Select-String -Path $buildLog -Pattern ': warning ' | Measure-Object).Count
            $lines.Add("| Build metric | Count |")
            $lines.Add("|---|---|")
            $lines.Add("| Errors | $errorCount |")
            $lines.Add("| Warnings | $warningCount |")
          } else {
            $lines.Add("_No build log found - the build step did not complete._")
          }
          $lines.Add("")

          # Name every failed test in this job's own log and step summary.
          # Each shard now runs exactly one test project/filter combination
          # per `dotnet test` invocation (`WP 20.3D`), so a red exit code
          # already narrows to one shard's own step above — but the .trx
          # that names the individual test is, right now, unreachable from
          # the run's own UI, because artefact upload is refused for an
          # account-level storage quota (see the upload steps' own note).
          # Without this a red run cannot be diagnosed from CI at all.
          # Diagnostic output only: the Test step above remains the gate and
          # its exit code is untouched.
          $failedResults = @()
          $allResults = @()

          $trxFiles = Get-ChildItem -Path $resultsDir -Filter "*.trx" -ErrorAction SilentlyContinue
          if ($trxFiles) {
            # Duration is read from each .trx's own <Times start= finish=>
            # (WP 17.0C) - the real wall-clock time that assembly's own
            # `dotnet test` invocation took, not a per-test sum. Purely
            # diagnostic, alongside the pass/fail counts already here:
            # never a gate, and parse failures are swallowed per-file so
            # one malformed .trx cannot blank the whole table.
            $lines.Add("| Test result file | Total | Passed | Failed | Duration |")
            $lines.Add("|---|---|---|---|---|")
            foreach ($file in $trxFiles) {
              # `-LiteralPath`: when two assemblies' .trx names collide the
              # runner de-duplicates by appending `[1]`, and `-Path` would
              # read that as a wildcard character class and fail to find a
              # file that exists (run 33659184434).
              [xml]$trx = Get-Content -LiteralPath $file.FullName
              $counters = $trx.TestRun.ResultSummary.Counters

              $duration = "n/a"
              try {
                $times = $trx.TestRun.Times
                if ($times -and $times.start -and $times.finish) {
                  $span = [DateTimeOffset]::Parse($times.finish) - [DateTimeOffset]::Parse($times.start)
                  $duration = $span.ToString("hh\:mm\:ss")
                }
              } catch {
                # Diagnostic only - an unparsable Times element leaves
                # duration as "n/a" rather than failing this step.
              }

              $lines.Add("| $($file.Name) | $($counters.total) | $($counters.passed) | $($counters.failed) | $duration |")
              $failedResults += $trx.TestRun.Results.UnitTestResult |
                Where-Object { $_.outcome -eq "Failed" }
              $allResults += $trx.TestRun.Results.UnitTestResult
            }

            # The ten slowest tests in this shard (v0.23.0 CI board G-12):
            # the per-test data a rebalance or a slowdown investigation
            # needs, without downloading the .trx. Diagnostic only.
            try {
              $slowest = $allResults |
                Where-Object { $_.duration } |
                Sort-Object { [TimeSpan]::Parse($_.duration) } -Descending |
                Select-Object -First 10
              if ($slowest) {
                $lines.Add("")
                $lines.Add("| Slowest tests | Duration |")
                $lines.Add("|---|---|")
                foreach ($result in $slowest) {
                  $lines.Add("| ``$($result.testName)`` | $(([TimeSpan]::Parse($result.duration)).ToString('mm\:ss\.f')) |")
                }
              }
            } catch {
              $lines.Add("")
              $lines.Add("_Could not rank the slowest tests: $($_.Exception.Message)_")
            }
          } elseif ($config -eq "Debug" -and "${{ github.event_name }}" -eq "pull_request") {
            $lines.Add("_Debug tests are not run on a pull request (ADR-0160): this leg built only. Pushes to main and release/** run them._")
          } else {
            $lines.Add("_No test results found - the test step did not complete._")
          }

          # Line coverage (WP 17.0C): one coverage.cobertura.xml per test
          # project, written by --collect:"XPlat Code Coverage" under
          # TestResults/$config/$shard/<guid>/ (`WP 20.3D`: the shard
          # segment is new, the <guid> nesting is not). Diagnostic only,
          # exactly like the pass/fail counts above - never a gate, and a
          # missing or unparsable file is reported as such rather than
          # failing this step; a Debug shard never collects coverage at
          # all (unchanged since `WP 19.9.1`), so it always reports none.
          $lines.Add("")
          $coverageFiles = Get-ChildItem -Path $resultsDir -Filter "coverage.cobertura.xml" -Recurse -ErrorAction SilentlyContinue
          if ($coverageFiles) {
            $lines.Add("| Coverage report | Line coverage |")
            $lines.Add("|---|---|")
            foreach ($file in $coverageFiles) {
              $label = $file.Directory.Name
              try {
                [xml]$cobertura = Get-Content -LiteralPath $file.FullName
                $lineRate = [double]$cobertura.coverage."line-rate"
                $percent = [math]::Round($lineRate * 100, 1)
                $lines.Add("| $label | $percent% |")
              } catch {
                $lines.Add("| $label | _unparsable coverage.cobertura.xml_ |")
              }
            }
          } else {
            $lines.Add("_No coverage.cobertura.xml found - the coverage collector did not produce output._")
          }

          if ($failedResults.Count -gt 0) {
            $lines.Add("")
            $lines.Add("#### Failed tests")
            $lines.Add("")
            Write-Host "--- Failed tests ($config / $shard) ---"
            foreach ($result in $failedResults) {
              $message = ($result.Output.ErrorInfo.Message -replace '\s+', ' ').Trim()
              $lines.Add("- ``$($result.testName)`` - $message")
              Write-Host "FAILED: $($result.testName)"
              Write-Host "        $message"
            }
            Write-Host "--- end failed tests ($config / $shard) ---"
          }

          $lines -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      # Artefact publication is diagnostic output, never a verification
      # gate: `continue-on-error` here so an account-level artefact
      # storage quota — which is outside this repository's control and
      # recalculated on GitHub's own 6-12 hour cycle — cannot turn a
      # genuinely passing build and test run red. Added against direct
      # evidence: run 33240113523 failed this step with "Failed to
      # CreateArtifact: Artifact storage quota has been hit", which would
      # have failed the job on its own even with a clean build. Build,
      # Test and the Governance Health Check are deliberately untouched
      # and remain hard gates. `WP 20.3D`: every one of the four shards in
      # a configuration now produces its own build log and its own .trx,
      # so both artefact names below carry `matrix.shard` too — an upload
      # of the same bare name from four parallel jobs in one run would
      # collide, not merely duplicate.
      - name: Upload build log (${{ matrix.configuration }} / ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: build-log-${{ matrix.configuration }}-${{ matrix.shard }}
          path: build-${{ matrix.configuration }}.log
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      # Not on a pull request's Debug legs (ADR-0160): they run no tests, so
      # there is nothing to upload and the upload would only warn.
      - name: Upload test results (${{ matrix.configuration }} / ${{ matrix.shard }})
        if: always() && (matrix.configuration == 'Release' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: test-results-${{ matrix.configuration }}-${{ matrix.shard }}
          # Recursive (v0.23.0 CI board G-11): the .trx sits at the top, but
          # hang dumps, the blame Sequence file and coverage.cobertura.xml
          # are written to a GUID subfolder and were being left behind.
          path: TestResults/${{ matrix.configuration }}/${{ matrix.shard }}/**
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      # Two separate artefacts, deliberately not one — ADR-0101 (`WP 11.3B`,
      # amended `WP 17.2B`): Tempest.Desktop is TempestOS's shipped
      # application; Tempest.Harness (WorkspaceShell) is the Internal
      # Engineering Harness, not a second product. Bundling both into one
      # "tempestos-release-build" artefact (as this step did through
      # WP 11.1A/WP 11.1B) implied they were co-equal deliverables —
      # corrected here. Debug output is not published for either: it is not
      # a release candidate and would only double artefact storage for no
      # verification benefit. Pinned to the `core` shard as well as Release
      # (`WP 20.3D`): the build output under `src/Tempest.Desktop/bin` and
      # `src/Tempest.Harness/bin` does not depend on which test filter a
      # shard happens to run — every Release shard's own Build step
      # produces the identical binary — so publishing from all four would
      # only quadruple identical bytes against the same account-level
      # storage quota this remark already names as a real, previously-hit
      # limit. One producer, so neither artefact name carries a shard
      # suffix. Kept 3 days for a pull request (about 145 MB per run, only
      # useful while the PR is under review) and 14 otherwise (v0.23.0 CI
      # board G-31); every upload in this job does the same.
      - name: Upload Tempest.Desktop build output (shipped application)
        if: matrix.configuration == 'Release' && matrix.shard == 'core'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: tempestos-desktop-release
          path: src/Tempest.Desktop/bin/Release/net10.0/**
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      - name: Upload Tempest.Harness build output (Internal Engineering Harness)
        if: matrix.configuration == 'Release' && matrix.shard == 'core'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: tempestos-engineering-harness
          path: src/Tempest.Harness/bin/Release/net10.0/**
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

  # WP 11.2A — Governance Health-Check. Independent of build-and-test: a
  # governance-document inconsistency is orthogonal to whether the code
  # compiles, so this job needs nothing the matrix produces and runs in
  # parallel with it (until v0.23.0 it waited for the whole matrix through
  # `needs: build-and-test` + `if: always()`, which only delayed the report
  # - v0.23.0 CI board G-31). Read-only: scripts/governance-
  # healthcheck.ps1 never writes inside the repository it validates.
  # WP 16.1A: this job's result is a required input to the CI Gate job
  # below, which still waits for both.
  governance-health-check:
    name: Governance Health Check
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-tags: true gets real tags (the Release Notes check needs
          # them to know which release folders are actually shipped).
          # fetch-depth: 0 (WP 17.0B, the new Markdown-vs-code check) gets
          # full history, without which `main`'s own commits - and so a
          # merge-base against this branch - are not present in a checkout
          # by SHA at all; that check already Warns rather than fails when
          # no merge base can be found, but a shallow clone would make it
          # Warn on every run instead of actually enforcing the budget.
          fetch-tags: true
          fetch-depth: 0
          # Pinned explicitly: without this, a tag-triggered push leaves
          # checkout's own default ref (github.ref, e.g. refs/tags/v0.11.0)
          # colliding with fetch-tags's own fetch of that identical tag -
          # both target the same local refs/tags/<name> path, and git
          # refuses ("Cannot fetch both <sha> and refs/tags/<name> to
          # refs/tags/<name>"). Checking out by commit SHA instead removes
          # the competing tag-ref write target entirely, on both a branch
          # push and a tag push (WP 11.9.0 Release Publication Report,
          # Finding 3).
          ref: ${{ github.sha }}

      - name: Run governance health check
        id: healthcheck
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP "governance-summary.txt"
          & "${{ github.workspace }}\scripts\governance-healthcheck.ps1" -SummaryPath $summaryPath
          $exitCode = $LASTEXITCODE
          if (Test-Path $summaryPath) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content -Path $summaryPath -Raw)
          }
          exit $exitCode

  # WP 21.5E / WP RC.0C ("Dependency vulnerability scan is a required CI
  # check"). `dotnet list package --vulnerable` exits 0 whether or not it
  # finds anything — it is a report, not a gate — so this job pairs it with
  # scripts/check-vulnerable-packages.ps1, which reads that report and fails
  # the step on any finding. That script also carries its own -SelfTest mode
  # (two synthetic fixtures — a clean run and a run with one synthetic
  # vulnerable package — asserted to classify correctly), exercised
  # independently by ChecksVulnerablePackagesScriptTests in
  # tests/Tempest.Core.Tests, so the parser's own correctness is proven
  # without waiting on a real advisory to appear.
  #
  # Runs against the whole solution in one `dotnet list` invocation (all
  # eight projects — WP 21.5E's own baseline, 2026-09-15) rather than
  # per-project, mirroring how Restore already treats the solution as the
  # unit of work everywhere else in this pipeline. Independent of
  # build-and-test (needs nothing it produces — only a restore of its own),
  # so it runs in parallel, as governance-health-check does.
  # Branch naming (PO rule, 2026-10-22; CLAUDE.md "Branch naming"): every
  # branch carries the version it ships in, so a stale branch can be told
  # apart, and cleaned up, by version alone. A pull request's head branch is
  # `v<version>/<topic>` or `release/v<version>`. Two kinds of branch cannot
  # choose their own name, so the version goes elsewhere: a Claude cloud
  # session's assigned `claude/...` branch puts it at the start of the PR
  # title (`v0.25.4: ...`), and Dependabot's `dependabot/...` is exempt.
  # Pushes (main, release/**, schedule, dispatch) have no head branch to
  # check, and pass.
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a versioned branch name
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Not a pull request: no head branch to check."
            exit 0
          fi
          version='v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?'
          if [[ "$HEAD_REF" =~ ^${version}/[a-z0-9][a-z0-9._-]*$ || "$HEAD_REF" =~ ^release/${version}$ ]]; then
            echo "Branch '$HEAD_REF' carries its version."
          elif [[ "$HEAD_REF" == dependabot/* ]]; then
            echo "Dependabot branch '$HEAD_REF': exempt."
          elif [[ "$HEAD_REF" == claude/* ]]; then
            if [[ "$PR_TITLE" =~ ^${version}:\  ]]; then
              echo "Claude session branch '$HEAD_REF': the PR title carries the version."
            else
              echo "::error::Claude session branch '$HEAD_REF' needs the version at the start of the PR title, e.g. 'v0.25.4: what it does' (CLAUDE.md, Branch naming). Edit the title, then re-run this check."
              exit 1
            fi
          else
            echo "::error::Branch '$HEAD_REF' is not versioned. Name it v<version>/<topic> (e.g. v0.25.4/invoice-tab) or release/v<version> (CLAUDE.md, Branch naming)."
            exit 1
          fi

  dependency-scan:
    name: Dependency Scan
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        id: setup-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The SDK download fails now and then on the download CDN (HTTP
      # 409), which failed whole legs before a line of
      # this repository ran. One retry after a pause; a second failure
      # fails the job here.
      - name: Wait before retrying the .NET SDK download
        if: steps.setup-dotnet.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Set up .NET SDK (from global.json, retry)
        if: steps.setup-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      - name: Scan for vulnerable packages
        shell: pwsh
        run: |
          $log = "dependency-scan.log"
          dotnet list "${{ env.SOLUTION_PATH }}" package --vulnerable --include-transitive 2>&1 | Tee-Object -FilePath $log
          & "${{ github.workspace }}\scripts\check-vulnerable-packages.ps1" -InputPath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "Dependency scan found a vulnerable package, or could not confirm a clean scan — see the log above."
          }
          exit $exitCode

      - name: Upload dependency scan log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: dependency-scan-log
          path: dependency-scan.log
          if-no-files-found: warn
          retention-days: 14

  # Licence check (white-team finding W-B-01, Addendum B §B5): every NuGet
  # package in any packages.lock.json, direct or transitive, must be listed
  # in scripts/licence-allowlist.json with an MIT, BSD-2-Clause,
  # BSD-3-Clause or Apache-2.0 licence, or carry an explicit, reasoned
  # exception there. Offline and deterministic: it reads only files in the
  # repository, so it needs no restore, no build and no .NET SDK.
  licence-check:
    name: Licence Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check NuGet package licences against the allow-list
        run: python3 scripts/check-licences.py

      # Addendum C, C-2 (M3): docs/calcs/glossary.md is generated from glossary-data.json and glossary-intro.md. Offline and deterministic, like the
      # licence check above: it fails when the document was edited by hand or the data changed and the script was not run.
      - name: Check the calculation glossary is what its generator writes
        run: python3 scripts/generate-glossary.py --check

  # DB-08 review: the full-size hostile-SVG probes (SvgBoundedProbeTests,
  # Category=BoundedProbe, opt-in through TEMPEST_BOUNDED_PROBES=1). Each
  # probe runs in a process of its own (Tempest.Desktop.dll --svg-probe)
  # under a 512 MB managed heap cap and a ulimit -v of the review's 2 GiB
  # plus the 1 GiB GC region range the harness reserves (3 GiB), with the
  # runtime's other start-up reservations held down (SEC-C-12: under a
  # bare 2 GiB they left nothing, and 34 of 54 probes aborted before
  # reading their file), and the test asserts its exit code, wall time and
  # peak working set against the review's bound. Linux, because ulimit is what keeps a class that still
  # allocates without bound from taking the runner with it; its own job,
  # because the files are up to 30 MB and took seconds to minutes, or
  # killed the process, before the fixes, and no test host should carry
  # them. The ordinary Desktop shards see the class return at once.
  svg-bounded-probes:
    name: SVG Bounded Probes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEMPEST_BOUNDED_PROBES: "1"
      TEMPEST_TEST_TIMEOUT_FACTOR: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        id: setup-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The SDK download fails now and then on the download CDN (HTTP
      # 409), which failed whole legs before a line of
      # this repository ran. One retry after a pause; a second failure
      # fails the job here.
      - name: Wait before retrying the .NET SDK download
        if: steps.setup-dotnet.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Set up .NET SDK (from global.json, retry)
        if: steps.setup-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      - name: Build the Desktop tests (Release)
        run: dotnet build tests/Tempest.Desktop.Tests --configuration Release --no-restore

      - name: Run the bounded probes, one process each
        run: |
          dotnet test tests/Tempest.Desktop.Tests \
            --configuration Release \
            --no-build \
            --logger trx \
            --logger "console;verbosity=normal" \
            --results-directory "TestResults/Release/svg-bounded-probes" \
            --filter "Category=BoundedProbe"

      - name: Upload the probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svg-bounded-probes
          path: TestResults/Release/svg-bounded-probes
          if-no-files-found: warn
          retention-days: 14

  # WP 16.5B — Linux/X11 launch smoke test. `TD-116` (a Linux `TypeLoadException`
  # inside Avalonia.FreeDesktop's DBus/X11 IME path, root-caused to a security
  # pin — `Tmds.DBus.Protocol` 0.94.2 — that Avalonia.FreeDesktop 11.2.3
  # could not bind against) is resolved by this Work Package's Avalonia
  # 11.3.20 / Tmds.DBus.Protocol 0.21.3 upgrade (see
  # "docs/releases/v0.16.0/WP16.5B Linux Launch Spike Report.md"). This job
  # is the ongoing verification: it launches the real, built
  # Tempest.Desktop.dll under Xvfb and treats "still running when the
  # timeout fires" (exit code 124, or 137 if the grace period's SIGKILL was
  # needed — see the spike report's launch-evidence section for why a bare
  # SIGTERM does not always end the process) as success; any other exit
  # (a crash) fails the job.
  #
  # Deliberately advisory, not required — NOT in `gate`'s `needs:` list
  # below, and this job passing does NOT make Linux CI-verified.
  #
  # `D-025`, ratified by the Product Owner on 2026-09-05, fixes the
  # support boundary and binds this comment: Windows is supported and
  # CI-verified; macOS is supported by design but not CI-verified; Linux
  # launches, on advisory smoke evidence and its determinism track
  # record, but is NOT CI-verified in the same sense as Windows. The
  # distinction between launch evidence and formal CI verification is to
  # be retained, and Linux is not to be recorded as "supported" without
  # qualification.
  #
  # This comment previously said Linux became "CI-verified in effect once
  # this job exists". It was written by `WP 16.5B` before ratification;
  # every document was hedged afterwards and this one was missed, until
  # the final release review found it (`WP 16.5B-R1`). A future Work
  # Package can promote this job into `gate` once it has a track record —
  # and only that promotion, not this job's existence, would change the
  # boundary.
  linux-launch-smoke:
    name: Linux Launch Smoke (advisory)
    runs-on: ubuntu-latest
    # 25 rather than 15 since `WP 21.5C` added the real-shell journey step
    # below, which builds the solution and then drives the application for
    # a few minutes. Still advisory, still not in `gate`.
    timeout-minutes: 25
    # Advisory means advisory: this job is not in the gate's needs list
    # (see below), and it must not turn the workflow run red either, because
    # scripts/new-release.ps1 reads the run's own conclusion before it
    # will tag. Its failure still shows on the job and as an annotation.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        id: setup-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The SDK download fails now and then on the download CDN (HTTP
      # 409), which failed whole legs before a line of
      # this repository ran. One retry after a pause; a second failure
      # fails the job here.
      - name: Wait before retrying the .NET SDK download
        if: steps.setup-dotnet.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Set up .NET SDK (from global.json, retry)
        if: steps.setup-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      - name: Build Tempest.Desktop (Release)
        run: dotnet build src/Tempest.Desktop/Tempest.Desktop.csproj --configuration Release --no-restore

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Launch under Xvfb (smoke)
        run: |
          set +e
          # Since `WP 17.2A` part 2 the platform attaches its console log
          # sink only when stdout is a real, unredirected console; with
          # stdout redirected to launch.log (as here) the log goes to the
          # rolling file sink at <persistence root>/logs/tempest-yyyyMMdd.log
          # and launch.log holds only what .NET itself writes. The root is
          # pinned through the `TEMPEST_` environment prefix so the file is
          # in a known place, and the marker below is read from it. The
          # first `v0.17.0` run of this job failed on exactly this: the app
          # launched, the marker was in the file log, launch.log was empty.
          ROOT="$RUNNER_TEMP/tempest-smoke"
          mkdir -p "$ROOT"
          TEMPEST_Persistence__RootPath="$ROOT" \
          xvfb-run -a timeout --kill-after=10 40 \
            dotnet src/Tempest.Desktop/bin/Release/net10.0/Tempest.Desktop.dll \
            > launch.log 2>&1
          code=$?
          echo "Exit code: $code"
          echo "--- launch.log (stdout/stderr) ---"
          cat launch.log
          LOGS=$(find "$ROOT" src/Tempest.Desktop/bin/Release/net10.0 -name 'tempest-*.log' 2>/dev/null)
          echo "--- platform log(s): ${LOGS:-none found} ---"
          for f in $LOGS; do cat "$f"; done
          if [ -f src/Tempest.Desktop/bin/Release/net10.0/logs/tempestos-crash.log ]; then
            echo "::error::A crash log was written - see logs/tempestos-crash.log"
            cat src/Tempest.Desktop/bin/Release/net10.0/logs/tempestos-crash.log
            exit 1
          fi
          # `WP 16.1A-R1` (v0.16.0 review board): "still running when the
          # timeout fired" is not by itself evidence of a successful
          # launch — a process that deadlocks *after* Avalonia platform
          # init (a stuck DI resolution, a frozen dispatcher loop) is also
          # still running at the timeout and used to pass this job
          # identically to a healthy one. Require a positive late-startup
          # marker in the captured log as well, so a hang before that
          # point fails even on the timeout branch.
          #
          # `TD-154`: one marker alone proved too little.
          # `TempestHost.EnterRunning`'s own "Host -> Running." line fires
          # deep inside `WorkspaceHost.StartAsync`, before
          # `MainWindowComposer` has built a single view — accepting it
          # alone only ever proved the Runtime Host's hosted-service
          # pipeline started, never that the Desktop shell itself composed.
          # `MainWindowComposer.Layout`'s own "Desktop -> Composed." line
          # (the true end of that composition, on the same real
          # construction path every Desktop test drives) is now required
          # too, and can only appear after "Host -> Running." does.
          # $LOGS is unquoted on purpose: it is a list of log files.
          # shellcheck disable=SC2086
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            if grep -qs "Host -> Running." launch.log $LOGS && grep -qs "Desktop -> Composed." launch.log $LOGS; then
              echo "Still running when the timeout fired, and startup reached 'Host -> Running.' and 'Desktop -> Composed.' - launched successfully."
              exit 0
            fi
            if grep -qs "Host -> Running." launch.log $LOGS; then
              echo "::error::Still running when the timeout fired, and the Runtime Host reached 'Host -> Running.', but the Desktop shell never logged 'Desktop -> Composed.' - the process hung composing the shell, not the Runtime Host."
              exit 1
            fi
            echo "::error::Still running when the timeout fired, but no log reached 'Host -> Running.' - the process hung during startup rather than launching."
            exit 1
          fi
          echo "::error::Tempest.Desktop exited on its own (code $code) - see the logs above."
          exit 1

      # `WP 21.5C` (Linux variant) - the real-shell acceptance journey.
      # The step above proves the application *launches*; this one drives
      # the built application through the product's own value chain
      # (reference data -> project and client -> quotation -> acceptance ->
      # engineering calculation -> evidence -> deliverable completion ->
      # invoicing) with genuine X11 input, screenshotting every step, then
      # closes it through the window's own close message and relaunches it
      # to prove what was created is still there. See
      # `docs/releases/v0.21.0/WP21.5C Real-Shell Journey (Linux) Report.md`
      # for the step table, the defects it found and how to run it locally.
      #
      # Advisory inside an already-advisory job: `continue-on-error` on the
      # job and on each step below, and this job is not in `gate`'s own
      # `needs:` list. It is evidence, not a merge gate, and `D-025`'s
      # support boundary is unchanged by it.
      - name: Install the journey's own tools (xdotool, ImageMagick)
        continue-on-error: true
        run: sudo apt-get install -y xdotool imagemagick

      - name: Real-shell acceptance journey (advisory)
        continue-on-error: true
        run: |
          chmod +x scripts/run-realshell-linux.sh
          scripts/run-realshell-linux.sh \
            --display :99 \
            --configuration Release \
            --out "$RUNNER_TEMP/realshell"

      - name: Upload the journey's own step tables and screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realshell-journey
          path: |
            ${{ runner.temp }}/realshell/journey
            ${{ runner.temp }}/realshell/verify
          if-no-files-found: warn
          retention-days: 14

  # WP 17.0C — Mutation testing (Stryker.NET), scoped to
  # src/Tempest.Core/Calculations/** and src/Tempest.Core/UnitsAndQuantities/**
  # (stryker-config.json at the repository root). Deliberately NOT run on
  # every push or pull request: a mutation-testing pass rebuilds the
  # solution and re-runs the affected test project once per surviving
  # mutant, which costs far more wall-clock time than this pipeline's own
  # build-and-test job for a diagnostic signal, not a merge gate — see the
  # `if:` below and the `schedule` trigger at the top of this file.
  # Deliberately NOT in `gate`'s `needs:` list, and this job's own pass/fail
  # (driven by stryker-config.json's break threshold) is informational
  # here, same as everywhere else in this pipeline that is advisory rather
  # than required.
  mutation:
    name: Mutation Testing (Stryker.NET)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        id: setup-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The SDK download fails now and then on the download CDN (HTTP
      # 409), which failed whole legs before a line of
      # this repository ran. One retry after a pause; a second failure
      # fails the job here.
      - name: Wait before retrying the .NET SDK download
        if: steps.setup-dotnet.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Set up .NET SDK (from global.json, retry)
        if: steps.setup-dotnet.outcome == 'failure'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore "${{ env.SOLUTION_PATH }}" --locked-mode

      - name: Restore dotnet tools (dotnet-stryker)
        run: dotnet tool restore

      # Reads stryker-config.json at the repository root by Stryker's own
      # default convention (looks for that exact filename in the current
      # working directory) - no -f flag needed. Its break threshold (70)
      # is what makes this step's own exit code meaningful; it is not
      # wired into `gate` regardless.
      - name: Run Stryker.NET
        run: dotnet stryker

      # Diagnostic output, same reasoning and same continue-on-error as
      # every other artefact upload in this workflow - the mutation run
      # itself (the step above) is what actually reports pass/fail;
      # losing the HTML/JSON report to an artefact-storage hiccup must
      # never turn a real mutation-score result into a workflow failure
      # nobody can diagnose.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: stryker-mutation-report
          path: StrykerOutput/**
          if-no-files-found: warn
          retention-days: 30

  # A single, named job every branch-protection rule can require, so
  # "the pipeline is green" has one unambiguous status check rather than
  # requiring both matrix legs to be individually named in every
  # protection rule — and so a future contributor reads one job name,
  # not the matrix's own internal shape, to know whether it is safe to
  # merge.
  #
  # `WP 20.3D`: `needs: build-and-test` already covers every `shard` value
  # of the matrix, not only `core` — a `needs:` dependency on a matrixed
  # job id waits for every combination under it, and `${{
  # needs.build-and-test.result }}` reads `failure` if any single
  # combination fails, `fail-fast: false` or not. No change was needed
  # here to satisfy that; this remark just states it, since sharding made
  # it worth confirming rather than assuming.
  #
  # WP 16.1A (v0.16.0): the gate now also requires governance-health-check
  # to succeed (that job no longer waits for the matrix; the gate waits
  # for both). WP 11.2A deliberately left it advisory ("machine-detectable
  # but not machine-enforced", FCR-0005) until the tool had demonstrated
  # itself on real drift; five releases and one further undocumented
  # 20-commit range later (WP 15.1A), a governance Fail is treated exactly
  # like a build Fail: red at the gate, not beside it. The
  # governance-health-check job does not depend on the build, so the
  # report is produced even when the build is red.
  #
  # WP 21.5E / WP RC.0C: the gate now also requires dependency-scan to
  # succeed — the same "red here is red at the gate" treatment, for the
  # identical reason: a required check nobody's merge can outrun is the only
  # kind that actually gates anything.
  #
  # W-B-01: the gate also requires licence-check to succeed, on the same
  # "red here is red at the gate" terms as dependency-scan.
  #
  # linux-launch-smoke (WP 16.5B) is deliberately NOT in the needs list:
  # advisory for this release — see the comment above that job for why.
  #
  # ADR-0160 (G-20): on a pull request the Debug legs skip their test
  # steps. That needs nothing here, by design. A skipped *step* leaves its
  # job `success`, so `needs.build-and-test.result` is still `success` only
  # when every leg built (and, where tests ran, passed), and the check
  # below stays a strict `-ne "success"`: `failure`, `cancelled` and
  # `skipped` all fail the gate. No job is skipped by the policy, so a
  # `skipped` result can only mean something went wrong upstream. `if:
  # always()` (not `!cancelled()`) is deliberate: it makes the gate run and
  # report red on a cancelled run, where a skipped gate would read as
  # passing to branch protection.
  #
  # Each failure is reported with `Write-Host "::error::..."`, not
  # `Write-Error`: pwsh on the runner runs with ErrorActionPreference=Stop,
  # so the first Write-Error threw and the remaining failures were never
  # printed (v0.23.0 CI board G-23).
  gate:
    name: CI Gate
    needs: [build-and-test, governance-health-check, dependency-scan, branch-name, licence-check, svg-bounded-probes]
    if: always()
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Confirm every configuration and the governance check passed
        shell: pwsh
        run: |
          $failed = $false
          # A run cancelled because a newer push superseded it stays red,
          # but says so: the newer commit's own run is the one that counts.
          if ("${{ needs.build-and-test.result }}" -eq "cancelled") {
            Write-Host "::error::Cancelled, usually because a newer push to this branch superseded the run. Read the newest commit's own CI Gate, not this one."
            exit 1
          }
          if ("${{ needs.build-and-test.result }}" -ne "success") {
            Write-Host "::error::One or more Build & Test configurations did not succeed - see the build-and-test job matrix for details."
            $failed = $true
          }
          if ("${{ needs.governance-health-check.result }}" -ne "success") {
            Write-Host "::error::Governance Health Check did not succeed - see that job's step summary for the failing check(s)."
            $failed = $true
          }
          if ("${{ needs.dependency-scan.result }}" -ne "success") {
            Write-Host "::error::Dependency Scan did not succeed - see that job's log for the finding."
            $failed = $true
          }
          if ("${{ needs.branch-name.result }}" -ne "success") {
            Write-Host "::error::Branch Name did not succeed - the branch (or, for a Claude session branch, the PR title) must carry its version; see that job's log."
            $failed = $true
          }
          if ("${{ needs.licence-check.result }}" -ne "success") {
            Write-Host "::error::Licence Check did not succeed - a NuGet package is missing from scripts/licence-allowlist.json or has a licence outside MIT, BSD-2/3-Clause and Apache-2.0; see that job's log."
            $failed = $true
          }
          if ("${{ needs.svg-bounded-probes.result }}" -ne "success") {
            Write-Host "::error::SVG Bounded Probes did not succeed - a hostile SVG probe exceeded its exit, time or memory bound (DB-08 review); see that job's log and the uploaded results."
            $failed = $true
          }
          if ($failed) { exit 1 }
          if ("${{ github.event_name }}" -eq "pull_request") {
            Write-Host "Pull request: Debug built in every leg; its tests are not run on a pull request (ADR-0160) and run on the push to main or release/**."
          }
          Write-Host "All Build & Test configurations, the Governance Health Check, the Dependency Scan, the Licence Check and the SVG Bounded Probes succeeded."
