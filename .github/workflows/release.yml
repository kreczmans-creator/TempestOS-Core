name: Release Publish

# WP 11.1B — Version-Tagging Workflow & Rollback Support.
#
# Triggered only by pushing an annotated tag matching the project's own
# versioning policy (see docs/releases/v0.11.0/WP11.1B Engineering
# Workflow.md, "Versioning Policy"): a final release ("v0.11.0",
# "v0.11.1"), a hotfix patch ("v0.10.1"), or a release candidate
# ("v0.11.0-rc.1"). Re-builds and re-tests Release configuration at the
# exact tagged commit — a release is not considered published until this
# workflow's own Build Gate and Test Gate pass a second, independent
# time, against the tag itself, not only against whatever CI run the
# feature branch happened to produce earlier — then publishes a GitHub
# Release with two separate assets attached: Tempest.Desktop's own build
# (TempestOS's shipped application) and, separately, Tempest.Harness's
# own build (the Internal Engineering Harness, ADR-0101, amended
# WP 17.2B) — never bundled into one artefact, so it is never ambiguous
# which download is the actual product (WP 11.3B).
#
# This is this project's rollback procedure's own mechanical foundation:
# every tagged release gets a durable (non-expiring, unlike this
# project's ordinary 14-day CI artifacts), downloadable build a future
# operator can always fall back to without needing to rebuild from
# source.
#
# `WP 21.5A` (`WP RC.0A` scope item 1) additionally publishes a
# Velopack-packaged Windows installer (`TempestOS-<tag>-Setup.exe`) and its
# update-feed assets, built by `scripts/package-installer.ps1` — the exact
# script a developer runs locally to reproduce the same installer, so this
# workflow needs no `act`-style GitHub-Actions-in-a-container tool to be
# validated. `dotnet run` and the plain zips above are unaffected: the
# installer is additive, never a replacement.
#
# ADR-0160 (PO decisions 2026-10-01, v0.23.0 CI board G-05, G-21) splits
# this workflow into three jobs:
#
#   ci-gate  waits for the `CI Gate` check run of ci.yml on this exact
#            commit and fails unless it concluded `success`. The tag push
#            starts ci.yml on the same SHA, so a release is published only
#            when CI is green on the tagged commit (until v0.23.0 the two
#            ran in parallel and a red CI did not stop the publish).
#   build    re-builds, re-tests and packages the tag with a read-only
#            token that is not persisted in .git/config, and uploads the
#            assets, SHA256SUMS.txt and the release notes as one artifact.
#            Restore, build, test and vpk (third-party code) never see a
#            token that can write to the repository.
#   publish  the only job with `contents: write`. It runs no repository
#            code: it downloads that artifact, checks every asset against
#            SHA256SUMS.txt and creates the GitHub Release. It needs both
#            jobs above, so a red, cancelled or missing CI Gate, or any
#            build/test/packaging failure, publishes nothing.
#
# A failed release run can be re-run once the cause is fixed (for example
# after CI on the tag is re-run green): "Re-run failed jobs" re-polls the
# newest CI Gate. A tag is still never moved (Engineering Governance 7.4).

on:
  push:
    tags:
      # A single pattern deliberately covers every tag shape this
      # project's versioning policy produces: "v0.11.0" (final),
      # "v0.10.1" (hotfix patch), and "v0.11.0-rc.1" (release candidate)
      # all match "v*.*.*" - GitHub's own tag-filter globs match "-rc.1"
      # as part of the trailing wildcard, so a second, RC-specific
      # pattern would be redundant, not additive.
      - "v*.*.*"

# Default for every job: read-only. Each job below states its own
# permissions; only `publish` can write (ADR-0160, G-05).
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  SOLUTION_PATH: src/TempestOS.slnx
  # The same render-deadline scaling ci.yml applies (DesktopTestHelpers.
  # Deadline). Without it this job ran every Desktop wait at 1x on the same
  # hosted runner CI needs 3x on, so a deadline that is fine in CI could
  # refuse a tag, and a refused tag cannot be moved (Engineering Governance
  # §7.4) - v0.23.0 CI board G-03.
  TEMPEST_TEST_TIMEOUT_FACTOR: "3"

jobs:
  # ADR-0160 (G-21): the release requires a green `CI Gate` on github.sha.
  #
  # Why polling the Checks API, and not a `workflow_run` trigger: a
  # `workflow_run` workflow always runs the copy of release.yml on the
  # default branch, not the one at the tag, and its event carries the CI
  # run's head branch rather than the tag, so the release would be built
  # from a workflow file that was never reviewed with the tagged commit and
  # would have to re-derive which tag it is publishing. Polling keeps the
  # trigger, the workflow file and the commit all the tag's own, needs only
  # `checks: read`, and runs alongside `build`, so it adds no time when CI
  # finishes first (CI usually takes about 15-25 min, `build` about 20-25).
  #
  # Rules: wait while no `CI Gate` check run exists for the SHA yet (the
  # tag-push CI run may not have started) or while any is still running;
  # then the newest one decides, and only `success` passes - `failure`,
  # `cancelled`, `timed_out` and anything else fail this job and so the
  # release. Two CI runs can exist for one SHA (the push to main and the
  # tag push); waiting for both and taking the newest means a re-run of CI
  # on the tag is what counts. Only check runs created by GitHub Actions
  # are read. 75 min covers CI's own 45-min leg ceiling plus queueing;
  # after that the job fails, saying so, rather than waiting forever.
  ci-gate:
    name: Wait for CI Gate on the tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      checks: read
    steps:
      - name: Require CI Gate = success for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 75 * 60 ))
          while true; do
            if runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=CI%20Gate&filter=all&per_page=100" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")]'); then
              count=$(jq 'length' <<<"$runs")
              pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
              if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
                conclusion=$(jq -r 'sort_by(.id) | last | .conclusion' <<<"$runs")
                url=$(jq -r 'sort_by(.id) | last | .html_url' <<<"$runs")
                if [ "$conclusion" = "success" ]; then
                  echo "CI Gate concluded 'success' for $SHA ($url)."
                  exit 0
                fi
                echo "::error::CI Gate concluded '$conclusion' for $SHA ($url). This tag will not be published. Fix the cause (or re-run CI on the tag if it was a flake), then re-run this workflow's failed jobs; a tag is never moved."
                exit 1
              fi
              echo "Waiting for CI Gate on $SHA: $count check run(s) found, $pending still running."
            else
              echo "::warning::Could not query check runs for $SHA; retrying."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No completed CI Gate check run for $SHA after 75 minutes. This tag will not be published. Confirm ci.yml ran on the tag, then re-run this workflow's failed jobs."
              exit 1
            fi
            sleep 30
          done

  build:
    name: Build, Test & Package Release
    runs-on: windows-2022
    # Read-only token, and not persisted (below): this job runs restore,
    # build, test and vpk, i.e. third-party code (ADR-0160, G-05).
    permissions:
      contents: read
    # Measured: the v0.22.0 release job took about 21 min, its unsharded
    # Release test step 18:16 (CI's Release Desktop shards summed to 25:46
    # for the same commit, so shard sums overstate this job). v0.23.0's
    # Release Desktop shards sum to 25:14, so expect about 18-21 min of
    # testing here. 30 leaves about 9 min of headroom; `--blame-hang`
    # below names a hung test long before that runs out.
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and real tags, as ci.yml's governance job has: the
          # Governance Health Check below needs the tags to know which
          # release folders have shipped, and skipped them on the shallow,
          # tagless default checkout (v0.23.0 CI board G-09). By SHA, not by
          # the tag ref, so fetch-tags does not collide with checkout's own
          # write of refs/tags/<name> (see ci.yml's governance checkout).
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          # The token is not left in .git/config for later steps (G-05);
          # nothing after checkout talks to the remote.
          persist-credentials: false

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build "${{ env.SOLUTION_PATH }}" `
            --configuration Release `
            --no-restore `
            -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release build failed for tag '${{ github.ref_name }}' - this tag will not be published."
            exit $LASTEXITCODE
          }

      # A tagged commit that fails its own re-verification here is not
      # published. Per Engineering Governance §7.4, a pushed tag is never
      # moved or recreated - if this happens, the corrective action is a
      # new patch version and a new tag (see "Rollback Procedure"),
      # never editing this one.
      - name: Test (Release)
        shell: pwsh
        run: |
          dotnet test "${{ env.SOLUTION_PATH }}" `
            --configuration Release `
            --no-build `
            --logger trx `
            --logger "console;verbosity=normal" `
            --results-directory "TestResults/Release" `
            --blame-hang `
            --blame-hang-timeout 5m
          if ($LASTEXITCODE -ne 0) {
            Write-Error "One or more tests failed for tag '${{ github.ref_name }}' - this tag will not be published."
            exit $LASTEXITCODE
          }

      # The release path must not be weaker than the merge path. `WP 16.1A`
      # made `CI Gate` depend on the Governance Health Check, so no branch
      # reaches `main` with a governance register that has drifted from
      # source — but this workflow, which is what actually publishes, never
      # ran that check at all. A tag could therefore be published carrying
      # drift that the merge gate would have rejected. Raised by the
      # `v0.16.0` review board (`WP 16.1A-R1`); the check is a hard gate
      # here, exactly as it is in `CI Gate`.
      - name: Governance Health Check
        shell: pwsh
        run: |
          ./scripts/governance-healthcheck.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The Governance Health Check failed for tag '${{ github.ref_name }}' - this tag will not be published."
            exit $LASTEXITCODE
          }

      # Two separate archives, deliberately not one — ADR-0101 (`WP 11.3B`,
      # amended `WP 17.2B`): Tempest.Desktop is TempestOS's shipped
      # application; Tempest.Harness (WorkspaceShell) is the Internal
      # Engineering Harness. The primary asset ("TempestOS-<tag>.zip") is
      # Tempest.Desktop alone, so it is unambiguous on the GitHub Release
      # page which download *is* TempestOS; the harness build is a
      # separate, clearly-named asset, never implied to be a second,
      # co-equal product.
      - name: Package Release build output
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          $desktopDir = "TempestOS-$tag"
          New-Item -ItemType Directory -Path $desktopDir -Force | Out-Null
          Copy-Item -Path "src/Tempest.Desktop/bin/Release/net10.0/*" -Destination $desktopDir -Recurse
          Compress-Archive -Path $desktopDir -DestinationPath "$desktopDir.zip"

          $harnessDir = "TempestOS-$tag-engineering-harness"
          New-Item -ItemType Directory -Path $harnessDir -Force | Out-Null
          Copy-Item -Path "src/Tempest.Harness/bin/Release/net10.0/*" -Destination $harnessDir -Recurse
          Compress-Archive -Path $harnessDir -DestinationPath "$harnessDir.zip"

      # `WP 21.5A` (`WP RC.0A` scope item 1): the Velopack-packaged
      # installer and its update-feed assets, built by the exact same
      # script a developer can run locally
      # (`scripts/package-installer.ps1`) — no `act`-style
      # GitHub-Actions-in-a-container tool stands between what this step
      # runs and what a person can reproduce on their own machine.
      # `--packVersion` must be strict semver (no leading `v`), unlike this
      # workflow's own zip assets below, which are named from the raw git
      # tag — so the tag's own `v` prefix is stripped here for Velopack's
      # sake only, and the produced `TempestOS-<semver>-Setup.exe` is
      # renamed to `TempestOS-<tag>-Setup.exe` immediately after, to match
      # every other asset this workflow publishes.
      - name: Package installer (Velopack)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $semver = $tag -replace '^v', ''

          ./scripts/package-installer.ps1 -Version $semver -OutputDirectory artifacts/installer
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installer packaging failed for tag '$tag' - this tag will not be published."
            exit $LASTEXITCODE
          }

          $setupSource = "artifacts/installer/TempestOS-$semver-Setup.exe"
          $setupDestination = "artifacts/installer/TempestOS-$tag-Setup.exe"
          if ($semver -ne $tag) {
            Move-Item $setupSource $setupDestination -Force
          }

      # Release notes are looked up by directory convention
      # (docs/releases/vX.Y.Z/Release Notes.md) — the same convention
      # scripts/new-release.ps1 checks before a final release is ever
      # tagged (WP11.1B). A release-candidate tag (the "-rc." suffix) has
      # no release-notes file of its own yet — expected, since an RC
      # precedes the release notes being finalised — so it falls back to
      # an honest, generated placeholder rather than failing.
      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $versionOnly = $tag -replace '^v', '' -replace '-rc\.\d+$', ''
          $notesPath = "docs/releases/v$versionOnly/Release Notes.md"

          if (Test-Path $notesPath) {
            Write-Host "Using $notesPath"
            "path=$notesPath" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            $placeholder = "release-notes-placeholder.md"
            "# TempestOS $tag`n`nRelease-candidate build. See the eventual v$versionOnly Release Notes for the full, curated summary." |
              Set-Content -Path $placeholder
            Write-Host "No release notes found at $notesPath - using generated placeholder ($placeholder)."
            "path=$placeholder" | Add-Content -Path $env:GITHUB_OUTPUT
          }

      # `WP 21.5F` Offensive Security Audit, OSA-10: no code-signing
      # infrastructure exists yet (no Authenticode certificate - acquiring
      # one is an organisational decision outside this Work Package's own
      # remit, named in the audit report as a candidate future `WP 21.x`).
      # Until it does, a published SHA-256 is the only integrity check
      # available to anyone who downloads these assets over the GitHub
      # Release page rather than building from source - without it,
      # nothing here lets a user notice a corrupted or substituted
      # download before running it. Computed after packaging and before
      # publishing, so the checksums describe exactly the bytes attached
      # to the release, not a separately-fetched copy. Every uploaded asset
      # is hashed, the installer and its update feed included (until
      # v0.23.0 only the two zips were - CI board G-04).
      #
      # ADR-0160 (G-05): the assets are staged flat in release-staging/
      # under the names they will have on the Release page, with
      # SHA256SUMS.txt, release-assets.txt (the upload list) and
      # release-notes.md beside them, and handed to `publish` as one
      # artifact. Both lists are written with LF line endings, so
      # `sha256sum -c SHA256SUMS.txt` works as is on Linux and macOS, in a
      # folder of downloads, and in `publish`, which runs it before
      # anything is published.
      - name: Stage release assets and compute checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $semver = $tag -replace '^v', ''
          $files = @(
            "TempestOS-$tag.zip",
            "TempestOS-$tag-engineering-harness.zip",
            "artifacts/installer/TempestOS-$tag-Setup.exe",
            "artifacts/installer/TempestOS-$semver-full.nupkg",
            "artifacts/installer/releases.win.json",
            "artifacts/installer/assets.win.json",
            "artifacts/installer/RELEASES"
          )
          # Absolute: [System.IO.File] resolves relative paths against the
          # process directory, not the PowerShell location.
          $staging = Join-Path $PWD.Path "release-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $names = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              Write-Error "Release asset '$file' is missing - this tag will not be published."
              exit 1
            }
            Copy-Item -LiteralPath $file -Destination $staging
            Split-Path -Leaf $file
          }
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $staging $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllText((Join-Path $staging "SHA256SUMS.txt"), (($lines -join "`n") + "`n"))
          [System.IO.File]::WriteAllText((Join-Path $staging "release-assets.txt"), (($names -join "`n") + "`n"))
          Copy-Item -LiteralPath "${{ steps.notes.outputs.path }}" -Destination (Join-Path $staging "release-notes.md")
          Get-Content (Join-Path $staging "SHA256SUMS.txt")

      # A hard gate, unlike ci.yml's diagnostic uploads: no artifact, no
      # release (no `continue-on-error`, and a missing file is an error).
      - name: Upload release assets for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-staging/
          if-no-files-found: error
          retention-days: 7

  # The only job that can write to the repository (ADR-0160, G-05). It
  # checks out nothing and runs no repository code: it publishes exactly
  # the bytes `build` hashed, after checking them against SHA256SUMS.txt.
  # `gh` is preinstalled on GitHub-hosted runners - no third-party
  # release-publishing action is used, consistent with WP 11.1A's own
  # minimal-supply-chain-surface precedent for this pipeline.
  publish:
    name: Publish GitHub Release
    needs: [ci-gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-staging

      # Every listed asset must match its published hash, and the upload
      # list and SHA256SUMS.txt must name exactly the same files, so
      # nothing is uploaded without a published hash.
      - name: Verify checksums
        working-directory: release-staging
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS.txt
          if ! diff <(sort release-assets.txt) <(awk '{print $2}' SHA256SUMS.txt | sort); then
            echo "::error::release-assets.txt and SHA256SUMS.txt do not list the same files - this tag will not be published."
            exit 1
          fi

      - name: Publish GitHub Release
        working-directory: release-staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < release-assets.txt
          args=(release create "$TAG" --verify-tag --title "TempestOS $TAG" --notes-file release-notes.md)
          if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" "${assets[@]}" SHA256SUMS.txt
